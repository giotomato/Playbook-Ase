---
- name: Probar variables recibidas desde la Survey de AWX
  hosts: Windows
  gather_facts: false

  vars:
    # Dominio autorizado definido internamente
    allowed_upn_domain: "asesuisa.com"

  tasks:

    # ============================================================
    # 1. MOSTRAR VARIABLES EXACTAMENTE COMO LAS ENTREGA AWX
    # ============================================================

    - name: Mostrar variables originales recibidas desde la Survey
      ansible.builtin.debug:
        msg:
          - "given_names = {{ given_names | default('NO RECIBIDO') }}"
          - "surnames = {{ surnames | default('NO RECIBIDO') }}"
          - "sam_account_name = {{ sam_account_name | default('NO RECIBIDO') }}"
          - "upn_domain = {{ upn_domain | default('NO RECIBIDO') }}"
          - "email_address = {{ email_address | default('VACÍO / NO RECIBIDO') }}"
          - "change_password_at_logon = {{ change_password_at_logon | default('NO RECIBIDO') }}"
          - "change_password_at_logon tipo = {{ change_password_at_logon | default(false) | type_debug }}"
          - "password_never_expires = {{ password_never_expires | default('NO RECIBIDO') }}"
          - "password_never_expires tipo = {{ password_never_expires | default(false) | type_debug }}"
          - "description = {{ description | default('NO RECIBIDO') }}"
          - "office = {{ office | default('NO RECIBIDO') }}"
          - "job_title = {{ job_title | default('NO RECIBIDO') }}"
          - "department = {{ department | default('NO RECIBIDO') }}"
          - "company = {{ company | default('NO RECIBIDO') }}"
          - "manager_username = {{ manager_username | default('NO RECIBIDO') }}"
          - "employee_id = {{ employee_id | default('NO RECIBIDO') }}"
          - "employee_id tipo = {{ employee_id | default('') | type_debug }}"
          - "reference_user = {{ reference_user | default('NO RECIBIDO') }}"
          - "request_ticket = {{ request_ticket | default('NO RECIBIDO') }}"

    # ============================================================
    # 2. VERIFICAR CONTRASEÑA SIN MOSTRAR SU CONTENIDO
    # ============================================================

    - name: Verificar recepción de la contraseña temporal
      ansible.builtin.set_fact:
        temporary_password_received: >-
          {{
            temporary_password is defined
            and temporary_password | length > 0
          }}
      no_log: true

    - name: Informar estado de recepción de la contraseña
      ansible.builtin.debug:
        msg: >-
          Contraseña temporal recibida:
          {{ temporary_password_received }}.
          El contenido no se muestra por motivos de seguridad.

    # ============================================================
    # 3. NORMALIZAR VARIABLES RECIBIDAS
    # ============================================================

    - name: Normalizar variables recibidas desde la Survey
      ansible.builtin.set_fact:
        normalized_given_names: >-
          {{
            given_names
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        normalized_surnames: >-
          {{
            surnames
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        normalized_sam_account_name: >-
          {{
            sam_account_name
            | default('')
            | trim
            | lower
          }}

        normalized_upn_domain: >-
          {{
            upn_domain
            | default(allowed_upn_domain)
            | trim
            | lower
            | regex_replace('^@', '')
          }}

        normalized_email_address: >-
          {{
            email_address
            | default('')
            | trim
            | lower
          }}

        normalized_description: >-
          {{
            description
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        normalized_office: >-
          {{
            office
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        normalized_job_title: >-
          {{
            job_title
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        normalized_department: >-
          {{
            department
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        normalized_company: >-
          {{
            company
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        normalized_manager_username: >-
          {{
            manager_username
            | default('')
            | trim
            | lower
          }}

        normalized_employee_id: >-
          {{
            employee_id
            | default('')
            | string
            | trim
          }}

        normalized_reference_user: >-
          {{
            reference_user
            | default('')
            | trim
            | lower
          }}

        normalized_request_ticket: >-
          {{
            request_ticket
            | default('')
            | trim
            | upper
          }}

        change_password_at_logon_bool: >-
          {{
            change_password_at_logon
            | default(true)
            | bool
          }}

        password_never_expires_bool: >-
          {{
            password_never_expires
            | default(false)
            | bool
          }}

    # ============================================================
    # 4. CONSTRUIR VARIABLES CALCULADAS
    # ============================================================

    - name: Construir nombre completo
      ansible.builtin.set_fact:
        display_name: >-
          {{
            normalized_given_names
            ~ ' '
            ~ normalized_surnames
          }}

    - name: Construir UPN
      ansible.builtin.set_fact:
        user_principal_name: >-
          {{
            normalized_sam_account_name
            ~ '@'
            ~ normalized_upn_domain
          }}

    - name: Construir correo electrónico final
      ansible.builtin.set_fact:
        final_email_address: >-
          {{
            normalized_email_address
            if normalized_email_address | length > 0
            else user_principal_name
          }}

    # ============================================================
    # 5. MOSTRAR VARIABLES NORMALIZADAS Y CALCULADAS
    # ============================================================

    - name: Mostrar variables normalizadas y calculadas
      ansible.builtin.debug:
        msg:
          - "Nombres: {{ normalized_given_names }}"
          - "Apellidos: {{ normalized_surnames }}"
          - "Nombre completo: {{ display_name }}"
          - "sAMAccountName: {{ normalized_sam_account_name }}"
          - "Dominio UPN: {{ normalized_upn_domain }}"
          - "User Principal Name: {{ user_principal_name }}"
          - "Correo ingresado: {{ normalized_email_address }}"
          - "Correo final: {{ final_email_address }}"
          - "Descripción: {{ normalized_description }}"
          - "Oficina: {{ normalized_office }}"
          - "Cargo: {{ normalized_job_title }}"
          - "Departamento: {{ normalized_department }}"
          - "Empresa: {{ normalized_company }}"
          - "Manager: {{ normalized_manager_username }}"
          - "EmployeeID: {{ normalized_employee_id }}"
          - "Usuario de referencia: {{ normalized_reference_user }}"
          - "Ticket: {{ normalized_request_ticket }}"
          - "Cambiar contraseña al iniciar: {{ change_password_at_logon_bool }}"
          - "Tipo de variable: {{ change_password_at_logon_bool | type_debug }}"
          - "Contraseña nunca expira: {{ password_never_expires_bool }}"
          - "Tipo de variable: {{ password_never_expires_bool | type_debug }}"
          - "Contraseña temporal recibida: {{ temporary_password_received }}"

    # ============================================================
    # 6. FINALIZAR PRUEBA
    # ============================================================

    - name: Finalizar prueba de variables
      ansible.builtin.debug:
        msg: >-
          Prueba finalizada correctamente. No se consultó
          Active Directory y no se realizaron modificaciones.
