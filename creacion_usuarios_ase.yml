---
- name: Crear usuario en Active Directory desde AWX
  hosts: windows_ad_management
  gather_facts: false

  collections:
    - microsoft.ad
    - ansible.windows

  vars:
    # Dominio admitido por la automatización
    dominio_upn_permitido: "asesuisa.com"

    # Variables internas de control
    usuario_creado_en_ejecucion: false
    rollback_si_falla: true

  module_defaults:
    group/microsoft.ad.domain:
      domain_server: "{{ ad_domain_server | default(omit) }}"
      domain_username: "{{ ad_domain_username | default(omit) }}"
      domain_password: "{{ ad_domain_password | default(omit) }}"

  tasks:

    # ============================================================
    # 1. NORMALIZACIÓN DE DATOS
    # ============================================================

    - name: Normalizar los datos recibidos desde la Survey
      ansible.builtin.set_fact:
        nombres_normalizados: >-
          {{
            nombres
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        apellidos_normalizados: >-
          {{
            apellidos
        
