---
- name: Probar variables recibidas desde la Survey de AWX
  hosts: windows_ad_management
  gather_facts: false

  vars:
    # Valor fijo definido en el playbook.
    dominio_upn_permitido: "asesuisa.com"

  tasks:

    # ============================================================
    # 1. MOSTRAR VARIABLES EXACTAMENTE COMO LAS ENTREGA AWX
    # ============================================================

    - name: Mostrar variables originales recibidas desde la Survey
      ansible.builtin.debug:
        msg:
          - "nombres = {{ nombres | default('NO RECIBIDO') }}"
          - "apellidos = {{ apellidos | default('NO RECIBIDO') }}"
          - "username = {{ username | default('NO RECIBIDO') }}"
          - "dominio_upn = {{ dominio_upn | default('NO RECIBIDO') }}"
          - "correo = {{ correo | default('VACÍO / NO RECIBIDO') }}"
          - "cambiar_password_inicio = {{ cambiar_password_inicio | default('NO RECIBIDO') }}"
          - "cambiar_password_inicio tipo = {{ cambiar_password_inicio | default(false) | type_debug }}"
          - "password_nunca_expira = {{ password_nunca_expira | default('NO RECIBIDO') }}"
          - "password_nunca_expira tipo = {{ password_nunca_expira | default(false) | type_debug }}"
          - "descripcion = {{ descripcion | default('NO RECIBIDO') }}"
          - "oficina = {{ oficina | default('NO RECIBIDO') }}"
          - "cargo = {{ cargo | default('NO RECIBIDO') }}"
          - "departamento = {{ departamento | default('NO RECIBIDO') }}"
          - "empresa = {{ empresa | default('NO RECIBIDO') }}"
          - "manager = {{ manager | default('NO RECIBIDO') }}"
          - "employee_id = {{ employee_id | default('NO RECIBIDO') }}"
          - "employee_id tipo = {{ employee_id | default('') | type_debug }}"
          - "usuario_referencia = {{ usuario_referencia | default('NO RECIBIDO') }}"
          - "ticket = {{ ticket | default('NO RECIBIDO') }}"

    # ============================================================
    # 2. VERIFICAR LA CONTRASEÑA SIN MOSTRAR SU CONTENIDO
    # ============================================================

    - name: Verificar recepción de la contraseña temporal
      ansible.builtin.debug:
        msg:
          - "password_temporal fue recibida = {{ password_temporal is defined }}"
          - "password_temporal tiene contenido = {{ password_temporal | default('') | length > 0 }}"
          - "longitud de password_temporal = {{ password_temporal | default('') | length }}"
      no_log: true

    - name: Informar que la contraseña fue recibida
      ansible.builtin.debug:
        msg: >-
          La contraseña temporal fue recibida por AWX.
          El contenido no se muestra por motivos de seguridad.
      when:
        - password_temporal is defined
        - password_temporal | length > 0

    - name: Informar que la contraseña no fue recibida
      ansible.builtin.debug:
        msg: >-
          La variable password_temporal no fue recibida
          o fue enviada vacía desde la Survey.
      when:
        - password_temporal is not defined
          or password_temporal | default('') | length == 0

    # ============================================================
    # 3. NORMALIZAR VARIABLES RECIBIDAS
    # ============================================================

    - name: Normalizar variables recibidas desde la Survey
      ansible.builtin.set_fact:
        nombres_normalizados: >-
          {{
            nombres
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        apellidos_normalizados: >-
          {{
            apellidos
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        usuario_normalizado: >-
          {{
            username
            | default('')
            | trim
            | lower
          }}

        dominio_normalizado: >-
          {{
            dominio_upn
            | default(dominio_upn_permitido)
            | trim
            | lower
            | regex_replace('^@', '')
          }}

        correo_normalizado: >-
          {{
            correo
            | default('')
            | trim
            | lower
          }}

        employee_id_normalizado: >-
          {{
            employee_id
            | default('')
            | string
            | trim
          }}

        manager_normalizado: >-
          {{
            manager
            | default('')
            | trim
          }}

        plantilla_normalizada: >-
          {{
            usuario_referencia
            | default('')
            | trim
            | lower
          }}

        descripcion_normalizada: >-
          {{
            descripcion
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        oficina_normalizada: >-
          {{
            oficina
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        cargo_normalizado: >-
          {{
            cargo
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        departamento_normalizado: >-
          {{
            departamento
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        empresa_normalizada: >-
          {{
            empresa
            | default('')
            | trim
            | regex_replace('\s+', ' ')
          }}

        ticket_normalizado: >-
          {{
            ticket
            | default('')
            | trim
          }}

        cambiar_password_inicio_booleano: >-
          {{
            cambiar_password_inicio
            | default(true)
            | bool
          }}

        password_nunca_expira_booleano: >-
          {{
            password_nunca_expira
            | default(false)
            | bool
          }}

    # ============================================================
    # 4. CONSTRUIR VARIABLES CALCULADAS
    # ============================================================

    - name: Construir nombre completo
      ansible.builtin.set_fact:
        nombre_completo: >-
          {{
            nombres_normalizados
            ~ ' '
            ~ apellidos_normalizados
          }}

    - name: Construir UPN
      ansible.builtin.set_fact:
        upn_generado: >-
          {{
            usuario_normalizado
            ~ '@'
            ~ dominio_normalizado
          }}

    - name: Construir correo final
      ansible.builtin.set_fact:
        correo_final: >-
          {{
            correo_normalizado
            if correo_normalizado | length > 0
            else upn_generado
          }}

    # ============================================================
    # 5. MOSTRAR RESULTADO DESPUÉS DE NORMALIZAR
    # ============================================================

    - name: Mostrar variables normalizadas y calculadas
      ansible.builtin.debug:
        msg:
          - "Nombres normalizados: {{ nombres_normalizados }}"
          - "Apellidos normalizados: {{ apellidos_normalizados }}"
          - "Nombre completo: {{ nombre_completo }}"
          - "Usuario normalizado: {{ usuario_normalizado }}"
          - "Dominio normalizado: {{ dominio_normalizado }}"
          - "UPN generado: {{ upn_generado }}"
          - "Correo ingresado: {{ correo_normalizado | default('') }}"
          - "Correo final: {{ correo_final }}"
          - "Descripción: {{ descripcion_normalizada }}"
          - "Oficina: {{ oficina_normalizada }}"
          - "Cargo: {{ cargo_normalizado }}"
          - "Departamento: {{ departamento_normalizado }}"
          - "Empresa: {{ empresa_normalizada }}"
          - "Manager: {{ manager_normalizado }}"
          - "EmployeeID: {{ employee_id_normalizado }}"
          - "Usuario de referencia: {{ plantilla_normalizada }}"
          - "Ticket: {{ ticket_normalizado }}"
          - "Cambiar contraseña al iniciar: {{ cambiar_password_inicio_booleano }}"
          - "Cambiar contraseña tipo final: {{ cambiar_password_inicio_booleano | type_debug }}"
          - "Contraseña nunca expira: {{ password_nunca_expira_booleano }}"
          - "Contraseña nunca expira tipo final: {{ password_nunca_expira_booleano | type_debug }}"

    # ============================================================
    # 6. FINALIZAR PRUEBA
    # ============================================================

    - name: Finalizar prueba de variables
      ansible.builtin.debug:
        msg: >-
          Prueba finalizada. No se consultó Active Directory,
          no se creó ningún usuario y no se realizaron modificaciones.
